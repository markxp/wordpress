load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Send OTel traces to the sidecar otel-collector
    otel_exporter {
        endpoint 127.0.0.1:4317;
    }
    otel_trace on;
    otel_service_name "wordpress-nginx";

    server {
        listen 80;
        root /var/www/html/web;
        index index.php;

        # Basic Security: Reject non-read HTTP methods on public server
        if ($request_method !~ ^(?:GET|HEAD|OPTIONS)$) {
            return 405;
        }

        # Basic Security: Block query-parameter bypasses before PHP-FPM
        if ($args ~* "(?:^|&)(?:tb|feed|author(?:_name)?|rest_route)=") {
            return 404;
        }

        # Basic Security: Deny hidden files (.env, .git, .htaccess)
        location ~ /\..+$ {
            return 404;
        }

        # Basic Security: Prevent direct PHP execution in uploads, core includes/content, and Bedrock app directories
        location ~ ^/(?:wp/)?(?:wp-includes|wp-content|app)/.*\.php$ {
            return 404;
        }

        # Basic Security: Allow public GET/HEAD access to admin-ajax.php if required
        location = /wp/wp-admin/admin-ajax.php {
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Basic Security: Block wp-admin, wp-login.php, wp-comments-post.php, xmlrpc.php, wp-cron.php, and legacy endpoints
        location ~* ^/(?:wp/)?(?:wp-admin(?:/|$)|(?:wp-login|wp-comments-post|xmlrpc|wp-cron|wp-signup|wp-activate|wp-mail|wp-settings|wp-trackback|wp-links-opml|wp-load|wp-blog-header|wp-app|wp-register)\.php$) {
            return 404;
        }

        # Basic Security: Block pretty-permalink trackbacks, feeds, author archives, comments REST API, and admin/login redirect aliases
        location ~* (?:/trackback(?:/|$)|/(?:feed|rdf|rss|rss2|atom)(?:/|$)|wp-(?:atom|rdf|rss|rss2|feed|commentsrss2)\.php$) {
            return 404;
        }

        location ~* ^/(?:author|wp-json/wp/v2/comments|(?:wp/)?(?:admin|dashboard|login(?:\.php)?))(?:/|$) {
            return 404;
        }

        # 60 seconds cache for static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 60s;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Explicit front-controller PHP execution whitelist
        location = /index.php {
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Deny all other direct .php execution
        location ~ \.php$ {
            return 404;
        }

        # WordPress fallback
        location / {
            try_files $uri $uri/ /index.php?$args;
        }
    }
}
