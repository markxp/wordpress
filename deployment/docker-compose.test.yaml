services:
  nginx:
    container_name: wp-sapi-nginx
    image: localhost/nginx-sapi-test:latest
    build:
      context: ..
      dockerfile: deployment/nginx.Dockerfile
    ports:
      - "${SAPI_NGINX_PORT:-18080}:8080"
      - "${SAPI_NGINX_HEALTH_PORT:-18081}:8081"
    environment:
      NGINX_PORT: 8080
      NGINX_HEALTH_PORT: 8081
      NGINX_BACKEND_HOST: "127.0.0.1:9000"
      NGINX_ENABLE_OTEL: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/nginx_status"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

  wordpress:
    container_name: wp-sapi-php-fpm
    image: "${SAPI_WORDPRESS_IMAGE:-localhost/wordpress-sapi-test:latest}"
    build:
      context: ..
      dockerfile: "${SAPI_PHP_FPM_DOCKERFILE:-deployment/php-fpm.Dockerfile}"
      target: app
    network_mode: "container:wp-sapi-nginx"
    volumes:
      - "${SAPI_DOTFILES_DIR:-./dotfiles}:/var/www/html/dotfiles:ro,z"
    environment:
      WP_ENV: testing
      WP_ENVIRONMENT_TYPE: local
      PM: static
      PM_MAX_CHILDREN: "3"
      PM_STATUS_LISTEN: "127.0.0.1:9001"
      OTEL_SDK_DISABLED: "true"
      OTEL_PHP_AUTOLOAD_ENABLED: "false"
      OTEL_PHP_DISABLED_INSTRUMENTATIONS: "all"
      OTEL_TRACES_EXPORTER: "none"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
    healthcheck:
      test: ["CMD", "php-fpm-ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      nginx:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: "no"

  mysql:
    container_name: wp-sapi-mysql
    image: mirror.gcr.io/library/mysql:8.4
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_520_ci"
      - "--default-time-zone=+00:00"
      - "--innodb-flush-method=fsync"
      - "--innodb-use-native-aio=0"
    network_mode: "container:wp-sapi-nginx"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - "${SAPI_INIT_SQL:-/dev/null}:/docker-entrypoint-initdb.d/01-wp-mock.sql:ro"
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "--protocol=TCP", "-u", "wordpress", "-pwordpress_test_password"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      nginx:
        condition: service_started
    restart: "no"
