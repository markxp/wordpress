version: 2
updates:
  # Maintain dependencies for Composer (root)
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "release-candidate"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for custom plugins with external requirements
  - package-ecosystem: "composer"
    directory: "/custom-plugins/iap-auth-shield"
    target-branch: "release-candidate"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/deployment"
    target-branch: "release-candidate"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(docker)"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release-candidate"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
