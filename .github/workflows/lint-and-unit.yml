name: Lint & Unit Tests

on:
  push:
    branches: ['main', 'release-candidate']
  pull_request:
    branches: ['release-candidate', 'main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release-candidate' }}

env:
  OTEL_PHP_DISABLED_INSTRUMENTATIONS: all

jobs:
  lint-and-unit:
    name: Lint & Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect relevant changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]]; then
            echo "Event '${EVENT_NAME}' always runs full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git rev-parse --verify -q HEAD^2 >/dev/null 2>&1; then
              CHANGED_FILES="$(git diff --name-only HEAD^1 HEAD)"
            elif [[ -n "$PR_BASE_SHA" ]]; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" >/dev/null 2>&1 || true
              if git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
                CHANGED_FILES="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
              else
                echo "Unable to resolve PR base commit ${PR_BASE_SHA}; running full suite."
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              echo "New branch or missing previous SHA; running full suite."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true
            fi
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" HEAD)"
            else
              echo "Previous commit ${BEFORE_SHA} unavailable; running full suite."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "Empty diff detected; running full suite as safeguard."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES" | sed 's/^/  - /'

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.md | LICENSE | */LICENSE | .gitignore | */.gitignore | .dockerignore | .env.example) ;;
              .vscode/* | .agents/* | deployment/*) ;;
              .github/dependabot.yml | .github/workflows/sapi-stack.yml | .github/workflows/plugin-sapi.yml | .github/workflows/update-site-kit-dev-settings.yml) ;;
              bin/test-root-sapi.sh | bin/update-site-kit-dev-settings.sh) ;;
              custom-plugins/*/readme.txt | custom-themes/*/readme.txt) ;;
              *)
                echo "Relevant change detected: ${file} -> running suite."
                echo "run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "Only documentation, deployment, or non-relevant files changed -> skipping heavy steps."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Setup PHP ${{ matrix.php }}
        if: steps.filter.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        if: steps.filter.outputs.run == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock', 'custom-plugins/*/composer.json', 'custom-themes/*/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Validate Composer manifests
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          composer validate --strict
          for dir in custom-plugins/*/ custom-themes/*/; do
            if [[ -f "${dir}composer.json" ]]; then
              composer validate --strict --working-dir="$dir"
            fi
          done

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php --ignore-platform-req=ext-grpc --ignore-platform-req=ext-opentelemetry

      - name: Check code style (Pint)
        if: steps.filter.outputs.run == 'true'
        run: composer lint

      - name: Run overall unit tests (PHPUnit)
        if: steps.filter.outputs.run == 'true'
        run: composer test

      - name: Run per-package unit test suites (PHPUnit)
        if: steps.filter.outputs.run == 'true'
        run: composer test:plugins
