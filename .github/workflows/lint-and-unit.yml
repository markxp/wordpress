name: Lint & Unit Tests

on:
  push:
    branches: ['main', 'release-candidate']
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: ['release-candidate', 'main']
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release-candidate' }}

env:
  OTEL_PHP_DISABLED_INSTRUMENTATIONS: all

jobs:
  lint-and-unit:
    name: Lint & Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock', 'custom-plugins/*/composer.json', 'custom-themes/*/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Validate Composer manifests
        shell: bash
        run: |
          shopt -s nullglob
          composer validate --strict
          for dir in custom-plugins/*/ custom-themes/*/; do
            if [[ -f "${dir}composer.json" ]]; then
              composer validate --strict --working-dir="$dir"
            fi
          done

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php --ignore-platform-req=ext-grpc --ignore-platform-req=ext-opentelemetry

      - name: Check code style (Pint)
        run: composer lint

      - name: Run overall unit tests (PHPUnit)
        run: composer test

      - name: Run per-package unit test suites (PHPUnit)
        run: composer test:plugins
