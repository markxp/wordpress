name: Plugin Lint, Unit & SAPI Tests

on:
  push:
    branches: ['main', 'release-candidate']
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: ['release-candidate', 'main']
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release-candidate' }}

jobs:
  validate-and-test:
    name: Validate, Lint & Test (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'custom-plugins/*/composer.json', 'custom-themes/*/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer manifests
        shell: bash
        run: |
          shopt -s nullglob
          composer validate --strict
          for dir in custom-plugins/*/ custom-themes/*/; do
            if [[ -f "${dir}composer.json" ]]; then
              composer validate --strict --working-dir="$dir"
            fi
          done

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-grpc --ignore-platform-req=ext-opentelemetry

      - name: Check code style (Pint)
        run: composer lint

      - name: Run overall unit tests (PHPUnit)
        run: composer test

      - name: Run per-package unit test suites (PHPUnit)
        run: composer test:plugins

      - name: Install Nginx and PHP-FPM for SAPI tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx-light
          if ! command -v php-fpm >/dev/null 2>&1 && ! command -v php-fpm8.5 >/dev/null 2>&1; then
            sudo apt-get install -y -qq php8.5-fpm
          fi

      - name: Run per-package SAPI tests (nginx + php-fpm)
        run: composer test:plugins:sapi
