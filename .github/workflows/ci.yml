name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-and-test:
    name: Validate, Lint & Test (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'custom-plugins/*/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate Composer manifests
        run: |
          composer validate
          for dir in custom-plugins/*/; do
            composer validate --strict --working-dir="$dir"
          done

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (Pint)
        run: composer lint

      - name: Run unit tests (PHPUnit)
        run: composer test
